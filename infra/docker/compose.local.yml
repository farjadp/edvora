# Local development stack. All outside providers are mocked in code; these are the real dependencies.
name: edvora
services:
  postgres:
    # The AI assistant (E-046) uses pgvector when available (CI runs pgvector/pgvector:pg16); without it the app falls
    # back to cosine in code. Switching an existing volume to that image is optional and needs a dump/restore.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edvora
      POSTGRES_PASSWORD: edvora
      POSTGRES_DB: edvora
    ports:
      - '5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edvora']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6389:6379'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8035:8025' # web UI
      - '1035:1025' # SMTP

  # Local S3-compatible storage (stands in for ArvanCloud Object Storage). MinIO no longer publishes images
  # (minio/minio and quay.io/minio/minio both refuse pulls since late 2025), so we use SeaweedFS (Apache-2.0).
  # S3 API on :9010. Keys from seaweedfs-s3.json (edvora / edvora-local-secret); unsigned requests are refused,
  # like a private ArvanCloud bucket.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - '9010:8333'
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
