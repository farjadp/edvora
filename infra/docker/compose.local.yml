# Local development stack. All outside providers are mocked in code; these are the real dependencies.
name: edvora
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edvora
      POSTGRES_PASSWORD: edvora
      POSTGRES_DB: edvora
    ports:
      - '5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edvora']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6389:6379'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8035:8025' # web UI
      - '1035:1025' # SMTP

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: edvora
      MINIO_ROOT_PASSWORD: edvora-secret
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
