name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # automerge.yml re-runs CI on develop after it merges (merges made with GITHUB_TOKEN don't fire `push`).
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector for the AI assistant's knowledge base (E-046, ADR 018); same Postgres 16 otherwise.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edvora
          POSTGRES_PASSWORD: edvora
          POSTGRES_DB: edvora
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U edvora" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://edvora:edvora@localhost:5442/edvora
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
      SESSION_SECRET: ci-only-session-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      SMS_PROVIDER: mock
      AI_PROVIDER_OVERRIDE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e:typecheck

  e2e:
    # The suite is ~27 min on one runner; four shards (each with its own Postgres, seed and dev server) keep every
    # job well under the timeout. Playwright splits by file, so serial specs stay together.
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # pgvector for the AI assistant's knowledge base (E-046, ADR 018); same Postgres 16 otherwise.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edvora
          POSTGRES_PASSWORD: edvora
          POSTGRES_DB: edvora
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U edvora" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://edvora:edvora@localhost:5442/edvora
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
      SESSION_SECRET: ci-only-session-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DEFAULT_TENANT_SLUG: iba
      PAYMENT_PROVIDER: mock
      SMS_PROVIDER: mock
      AI_PROVIDER_OVERRIDE: mock
      E2E_PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The seed script reads apps/web/.env; job env above takes precedence over the example values.
      - run: cp apps/web/.env.example apps/web/.env
      # Fresh Postgres service per run, so this is a fresh seed.
      - run: pnpm seed
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
